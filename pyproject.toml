[project]
name = "tg-active-channels-parser"
version = "0.1.0"
description = "Telegram bot that finds active public channels for ad buying research"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.13,<4",
    "python-dotenv>=1.0,<2",
    "telethon>=1.36,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
]

[project.scripts]
tg-active-channels = "ChannelsParser.cli:main"
tg-active-channels-bot = "ChannelsParser.bot:main"
tg-active-channels-login = "ChannelsParser.login:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ChannelsParser"]

[tool.pytest.ini_options]
pythonpath = ["src"]
